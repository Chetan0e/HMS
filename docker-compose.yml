version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: hms-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hms_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hms-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=hms_db
      - JWT_SECRET=docker-secret-key-hms-2026
      - JWT_REFRESH_SECRET=docker-refresh-secret-key-hms-2026
      - UPLOAD_PROVIDER=local
      - UPLOAD_DIR=/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: hms-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
